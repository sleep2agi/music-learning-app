name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;36.0.0 build-tools;35.0.0

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package artifacts
        run: |
          (cd dist && zip -r ../lequdao-web.zip .)
          cp android/app/build/outputs/apk/debug/app-debug.apk lequdao-debug.apk

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: lequdao-web
          path: lequdao-web.zip
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lequdao-debug-apk
          path: lequdao-debug.apk
          if-no-files-found: error

  desktop-mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build unsigned Mac disk image
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # Never let electron-builder publish: it does so on CI and on tags, and fails without GH_TOKEN.
        run: npx electron-builder --mac --universal --publish never

      - name: Upload Mac disk image
        uses: actions/upload-artifact@v7
        with:
          name: lequdao-mac
          path: release/lequdao-mac.dmg
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build unsigned Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # Never let electron-builder publish: it does so on CI and on tags, and fails without GH_TOKEN.
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: lequdao-windows
          path: release/lequdao-windows.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop-mac, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: lequdao-*
          merge-multiple: true
          path: publish

      - name: Attach files to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            publish/lequdao-web.zip
            publish/lequdao-debug.apk
            publish/lequdao-mac.dmg
            publish/lequdao-windows.exe
